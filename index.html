];
const SETTINGS_STORAGE_KEY = "eggroom.settings.v1";

function loadSettings() {
  try {
    const saved = JSON.parse(localStorage.getItem(SETTINGS_STORAGE_KEY) || "{}");
    if (Number.isFinite(saved.walkSpeed)) {
      settings.walkSpeed = Math.max(0.5, Math.min(4, +saved.walkSpeed.toFixed(1)));
    }
    if (Number.isInteger(saved.krisSet)) {
      settings.krisSet = Math.max(0, Math.min(KRIS_SETS.length - 1, saved.krisSet));
    }
    if (typeof saved.manVisible === "boolean") settings.manVisible = saved.manVisible;
    if (Number.isInteger(saved.walkMode)) {
      settings.walkMode = Math.max(0, Math.min(WALK_MODES.length - 1, saved.walkMode));
    }
    if (Number.isInteger(saved.menuStyle)) {
      settings.menuStyle = Math.max(0, Math.min(MENU_STYLES.length - 1, saved.menuStyle));
    }
    if (Number.isInteger(saved.dialogSize)) {
      settings.dialogSize = Math.max(0, Math.min(DIALOG_SIZES.length - 1, saved.dialogSize));
    }
  } catch (_) {
    // Storage may be unavailable or contain old/corrupt data; defaults are safe.
  }
}

function saveSettings() {
  try { localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify(settings)); }
  catch (_) { /* The game still works when browser storage is disabled. */ }
}

function updateSetting(change) {
  change();
  saveSettings();
}

  manLeaving: false,   // set at interact start, applied when the scene drains
  gotEgg: false,
  talked: 0,           // 0 = first talk, 1 = second, 2+ = "..."
  haveAlleggs: false,  // debug toggle (normally you'd carry eggs from ch2-4)
  fade: 0, fadeTo: 0,
  dbg: false,
  treeSel: 3,          // current tree index in TREES (3 = treetiles_new FULL TREE)
  treeSelMode: false,  // O-key selector open
  treePage: 0,         // selector page (0 = 1-10, 1 = 11-16)
  moveMode: false,     // P-key tree positioning mode
  colDbg: false,       // I-key collision debug overlay
  menu: "title",       // title screen menu: "title" | "settings"
  menuSel: 0,          // selected row in the settings menu
  completedRun: false  // set after leaving with the Egg; next start resets the room
};

/* ---------------- dialogue engine ---------------- */
const DLG = {
  queue: [],       // {text, choices, blip, onDone, slow}
  idx: 0, pos: 0,  // current page index, source char position
  showing: false,
  typing: true,
  choice: -1,      // -1 = no choice on this page
  choiceSel: -1,     // official choicer begins with the SOUL between the options
  heartX: 312,
  heartY: H - 94,
  alarm: 0,        // typing alarm in 30fps game frames (obj_writer/Alarm_0.gml port)
  rate: 1,         // characters per 30fps frame (Deltarune's rate=1; slow pages use 2)
  soundTimer: 0,   // blip throttle: scr_textsound plays every other character
  layout: null,    // fixed pre-wrapped page layout (never reflows while typing)
  page: null,
  onDone: null
};

function stripGameCodes(s) {
  // remove \E0-style speaker/effect codes, keep ^1 pauses and / page breaks
  return s.replace(/\\[A-Z][0-9]*/g, "").replace(/\\[a-z0-9]/g, "");
}

function pushPage(text, opts = {}) {
  DLG.queue.push({
    text: stripGameCodes(text).replace(/[\/%]+$/, ""),
    choices: opts.choices || null,
    slow: opts.slow || false,
    onDone: opts.onDone || null
  });
}

function dMake() {   // open next queued page
  if (DLG.queue.length === 0) { return; }
  const p = DLG.queue.shift();
  DLG.page = p;
  DLG.typing = true;
  DLG.choice = -1;
  DLG.choiceSel = -1;
  DLG.heartX = 312;
  DLG.heartY = H - 94;
  DLG.rate = p.slow ? 2 : 1;   // Deltarune rate: 1 char per 30fps game frame
  DLG.alarm = DLG.rate;
  DLG.soundTimer = 0;
  DLG.pos = 1;                 // the first character appears together with the box
  DLG.layout = pageLayout(p.text);
  DLG.showing = true;
  DLG.onDone = p.onDone;
}

function dEx() { return DLG.showing && DLG.queue.length === 0; }
function dDone() { // advance/close the current page
  if (!DLG.showing) return;
  if (DLG.typing) { DLG.typing = false; DLG.pos = DLG.page.text.length; return; }
  if (DLG.page.choices && DLG.choice === -1) { return; } // awaiting choice
  // page over -> next page or close (run onDone first so it can queue pages)
  DLG.showing = false;
  const cb = DLG.onDone; DLG.onDone = null;
  if (cb) cb();
  if (DLG.queue.length > 0) { dMake(); }
  else if (state.manLeaving) { state.manGone = true; state.manLeaving = false; }
}

function pushChoice(msg, options, onDone) {
  DLG.queue.push({
    text: stripGameCodes(msg).replace(/[\/%]+$/, ""), choices: options, slow: false,
    onDone: onDone || null
  });
}

function startDialogue() { DLG.showing = true; dMake(); }

/* ---------------- the man's scene (from obj_room_man/Step_0.gml) ---------------- */

function manInteract() {
  if (state.talked === 0) {
    pushPage("* (Well^1, there is a man here.)/");
    pushPage("* (He offers you something.)/");
    pushChoice("", ["Yes", "No"], () => {
      if (DLG.choice === 0) {
        state.gotEgg = true;
        playSound(eggSfxEl);
        pushPage("* (You received the \"Egg\".)/");
        pushChoice("", ["Ask for more", "Do Not"], () => {
          if (state.haveAlleggs) {
            pushPage("* (Well^1, the man put his hand softly on your shoulder.)/");
            pushPage("* (And^1, showing you his empty palm...)/");
            pushPage(DLG.choice === 0
              ? "* (He put his finger to his mouth^1, smiled^1, and shook his head.)/"
              : "* (He put his finger to his mouth^1, smiled^1, and nodded his head.)/");
            pushPage("* (It seems you have everything.)/");
            pushPage("* (...)/");
            pushPage("* (He waved goodbye^1, looking away slightly after a moment.)/");
            pushPage("* (...)/");
            pushPage("* (Kris felt a strange melancholy.)/");
            pushPage("* (It was a feeling that they should not look for the man anymore.)/");
            pushPage("* (..^1. even though they had never done such a thing in the first place.)/");
          } else {
            pushPage("* (The man nodded vigorously.)/");
            pushPage("* (He pointed into the distance.)/");
            pushPage("* (Over there^1, was another tree.)/");
            pushPage("* (In fact^1, it seemed very much like this tree.)/");
            pushPage("* (Craning your head^1, you noticed that there was another tree after that.)/");
            pushPage("* (It felt a little bit like looking into series of mirrors...)/");
            pushPage("* (Your head began to spin.)/");
            pushPage("* (..^1. the man saw this and looked concerned.)/");
            pushPage("* (He seemed like he wanted to speak^1, but...)/");
            pushPage("* (...)/");
            pushPage("* (Well^1, the man smiled.)/");
            pushPage("* (And he waved goodbye^1, for now.)/");
          }
          state.manLeaving = true;
        });
      } else {
        pushPage("* (Well^1, there is not a man here.)/");
      }
    });
  } else if (state.talked === 1) {
    if (state.haveAlleggs || state.gotEgg) {
      pushPage("* (Well^1, there is not a man here.)/");
      pushPage("* (..^1. but^1, on Kris's shoulder^1, a weight remained.)/");
      pushPage("* (A weight that carried far^1, far^1, into the distance...)/");
    } else {
      pushPage("* (Well^1, there is not a man here.)/");
    }
  } else {
    pushPage("* (...)/");
  }
  state.talked++;
  state.manLeaving = true;
}

function treeInteract() {
  // obj_room_man replaces the original line once the man has gone.
  pushPage(state.manGone ? "* (It is a tree.)/" : "* (He is behind the tree.)/");
}

/* ---------------- input ---------------- */
const keys = {};
const PRESSED = {};
window.addEventListener("keydown", e => {
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
  // while the debug shape editor has a shape selected, arrows belong to it
  if (state.colDbg && debugSel !== null && e.key.indexOf("Arrow") === 0) return;
  if (!e.repeat) PRESSED[e.key.toLowerCase()] = true;
  keys[e.key.toLowerCase()] = true;
});
window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

// title / settings menu keyboard navigation
function handleMenuKeys() {
  if (state.started) return;
  const k = pressedAnyKey();
  if (!k) return;
  if (state.menu === "title") {
    if (k === "z" || k === "enter" || k === " ") { startGame(); }
    else if (k === "s" || k === "b") { state.menu = "settings"; state.menuSel = 0; playSound(cursorEl, 0.5); }
    return;
  }
  // settings menu
  if (k === "arrowup" || k === "w") { state.menuSel = (state.menuSel + 6) % 7; playSound(cursorEl, 0.5); }
  else if (k === "arrowdown" || k === "s") { state.menuSel = (state.menuSel + 1) % 7; playSound(cursorEl, 0.5); }
  else if (state.menuSel === 0 && (k === "arrowleft" || k === "a")) { updateSetting(() => { settings.walkSpeed = Math.max(0.5, +(settings.walkSpeed - 0.1).toFixed(1)); }); playSound(cursorEl, 0.5); }
  else if (state.menuSel === 0 && (k === "arrowright" || k === "d")) { updateSetting(() => { settings.walkSpeed = Math.min(4, +(settings.walkSpeed + 0.1).toFixed(1)); }); playSound(cursorEl, 0.5); }
  else if (state.menuSel === 1 && (k === "arrowleft" || k === "a" || k === "arrowright" || k === "d" || k === "z" || k === "enter" || k === " ")) { updateSetting(() => { settings.walkMode = (settings.walkMode + 1) % WALK_MODES.length; }); playSound(cursorEl, 0.5); }
  else if (state.menuSel === 2 && (k === "arrowleft" || k === "a")) { updateSetting(() => { settings.krisSet = (settings.krisSet + KRIS_SETS.length - 1) % KRIS_SETS.length; }); playSound(cursorEl, 0.5); }
  else if (state.menuSel === 2 && (k === "arrowright" || k === "d")) { updateSetting(() => { settings.krisSet = (settings.krisSet + 1) % KRIS_SETS.length; }); playSound(cursorEl, 0.5); }
  else if (state.menuSel === 3 && (k === "arrowleft" || k === "a" || k === "arrowright" || k === "d" || k === "z" || k === "enter" || k === " ")) { updateSetting(() => { settings.manVisible = !settings.manVisible; }); playSound(cursorEl, 0.5); }
  else if (state.menuSel === 4 && (k === "arrowleft" || k === "a" || k === "arrowright" || k === "d" || k === "z" || k === "enter" || k === " ")) { updateSetting(() => { settings.menuStyle = (settings.menuStyle + 1) % MENU_STYLES.length; }); playSound(cursorEl, 0.5); }
  else if (state.menuSel === 5 && (k === "arrowleft" || k === "a")) { updateSetting(() => { settings.dialogSize = (settings.dialogSize + DIALOG_SIZES.length - 1) % DIALOG_SIZES.length; }); playSound(cursorEl, 0.5); }
  else if (state.menuSel === 5 && (k === "arrowright" || k === "d" || k === "z" || k === "enter" || k === " ")) { updateSetting(() => { settings.dialogSize = (settings.dialogSize + 1) % DIALOG_SIZES.length; }); playSound(cursorEl, 0.5); }
  else if (k === "escape" || k === "backspace" || (state.menuSel === 6 && (k === "z" || k === "enter" || k === " "))) { state.menu = "title"; playSound(cursorEl, 0.5); }
}

function pressedAnyKey() {
  for (const n of ["z", "enter", " ", "s", "b", "arrowup", "arrowdown", "arrowleft", "arrowright", "w", "a", "d", "escape", "backspace"]) {
    if (pressed(n)) return n;
  }
  return null;
}

function pressed(name) {
  const k = PRESSED[name]; PRESSED[name] = false;
  return !!k;
}
function anyKey(nameList) { return nameList.some(n => pressed(n)); }
function held(name) { return !!keys[name]; }
function clearPressed() {
  // Edge-triggered inputs last for one frame only. Without this, movement
  // used on the way to the tree can linger and change a later dialogue choice.
  for (const key of Object.keys(PRESSED)) PRESSED[key] = false;
}

/* ---------------- audio ---------------- */
function makeEl(src, loop) {
  const a = new Audio(src);
  a.loop = !!loop;
  a.volume = 0.9;
  return a;
}
function playSound(el, vol) {
  if (!el) return;
  // Small round-robin pool: the text blip fires ~15x/sec, and cloneNode()
  // per blip churns media elements. Reuse 4 nodes per source.
  if (!el._pool) {
    el._pool = [];
    el._poolIdx = 0;
    for (let i = 0; i < 4; i++) el._pool.push(el.cloneNode());
  }
  const c = el._pool[el._poolIdx];
  el._poolIdx = (el._poolIdx + 1) % el._pool.length;
  try { c.pause(); c.currentTime = 0; } catch (_) {}
  c.volume = vol || 0.9;
  c.play().catch(() => {});
}

/* ---------------- font ---------------- */
function parseFontCsv(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
  lines.shift(); // header
  for (const line of lines) {
    const p = line.split(";");
    if (p.length < 7) continue;
    const code = parseInt(p[0], 10);
    glyphs[code] = {
      sx: parseInt(p[1], 10), sy: parseInt(p[2], 10),
      w:  parseInt(p[3], 10), h:  parseInt(p[4], 10),
      shift: parseInt(p[5], 10), offset: parseInt(p[6], 10)
    };
  }
}

function tintAtlas(color) {
  const out = document.createElement("canvas");
  out.width = img.font.width;
  out.height = img.font.height;
  const c = out.getContext("2d");
  c.drawImage(img.font, 0, 0);
  c.globalCompositeOperation = "source-in";
  c.fillStyle = color;
  c.fillRect(0, 0, out.width, out.height);
  c.globalCompositeOperation = "source-over";
  return out;
}

function textWidth(str) {
  let w = 0;
  for (const ch of str) {
    const g = glyphs[ch.charCodeAt(0)];
    if (!g) { w += 7; continue; }
    w += g.shift;
  }
  return w;
}

function atlasForColor(color) {
  let atlas;
  if (color === "#fff" || color === "#ffffff") atlas = fontAtlasWhite;
  else if (color === "#ffff00") atlas = fontAtlasYellow;
  else if (color === "#ff6b6b") atlas = fontAtlasRed;
  else if (color === "#aaa" || color === "#888") atlas = fontAtlasGray;
  else atlas = fontAtlasBlack;
  return atlas;
}

function drawTextScaled(str, x, y, color = "#000", scale = 1) {
  const atlas = atlasForColor(color);
  if (!atlas) return;
  let cx = x;
  for (const ch of str) {
    if (ch === "\n") { continue; }
    const g = glyphs[ch.charCodeAt(0)];
    if (!g) { cx += 7 * scale; continue; }
    if (g.w > 0 && g.h > 0) {
      ctx.drawImage(atlas, g.sx, g.sy, g.w, g.h,
                    cx, y + g.offset * scale, g.w * scale, g.h * scale);
    }
    cx += g.shift * scale;
  }
}

function drawText(str, x, y, color = "#000") {
  drawTextScaled(str, x, y, color, 1);
}

function drawCrackedLogo(x, y) {
  if (img.crackedLogo) {
    // Exact 2x pixel mask supplied in the reference, reduced to game resolution.
    ctx.drawImage(img.crackedLogo, x, y - 2, 65, 14.5);
  } else {
    drawText("DELTARUNE", x, y, "#fff");
  }
}

/* ---------------- room / rendering ---------------- */
function floorContains(x, y) {
  const px = x;
  const py = y - 2; // Kris's feet, with a small margin from the void
  // Inset only the exposed horizontal edges. The adjoining Y edges stay
  // flush, otherwise tiny invisible collision gaps appear at each step.
  const inside = (rx, ry, rw, rh) =>
    px >= rx + 7 && px <= rx + rw - 7 && py >= ry && py <= ry + rh;
  return inside(FLOOR.tx, FLOOR.ty + 3, FLOOR.tw, FLOOR.th - 3) ||
         inside(FLOOR.hx, FLOOR.hy, FLOOR.hw, FLOOR.hh) ||
         inside(FLOOR.mx, FLOOR.my, FLOOR.mw, FLOOR.mh) ||
         inside(FLOOR.vx, FLOOR.vy, FLOOR.vw, FLOOR.vh);
}

function pointInBox(x, y, box) {
  return x > box.x && x < box.x + box.w &&
         y > box.y && y < box.y + box.h;
}

// The room tree uses a dedicated trunk/root solid. Its animated leaves are
// visual scenery, not collision geometry; keeping them out of this test lets
// Kris pass behind the canopy and circle the trunk without invisible snags.
function roomCollides(x, y) {
  const t = TREES[state.treeSel];
  if (t && t.trunkCollision) {
    // The hidden man remains a directional interaction trigger, but is not a
    // second movement wall. The previous tall man solid crossed the rear path.
    return pointInBox(x, y, COLLBOX);
  }
  if (t && t.img && t.col) {
    const z = TREE.z;
    const dw = t.img.width * z, dh = t.img.height * z;
    const left = TREE.x - dw / 2, top = TREE.y - dh;
    const py = y - 10; // collision point at Kris's mid-body
    let lx = Math.floor((x - left) / z);
    const ly = Math.floor((py - top) / z);
    if (t.flipX) lx = t.col.w - 1 - lx;
    if (lx >= 0 && ly >= 0 && lx < t.col.w && ly < t.col.h) {
      return t.col.data[ly * t.col.w + lx] > 40;
    }
    return false;
  }
  // fallback: circle around the trunk
  const dx = x - TREE.x, dy = (y - 10) - (TREE.y - 42);
  return dx * dx + dy * dy < (TREE_R + 6) * (TREE_R + 6);
}

/* ---------------- player movement ---------------- */
// Classic mode: the prototype's original 8-way smooth walker.
// Deltarune mode: a faithful port of obj_mainchara/Step_0.gml (chapter 2,
// light world). The game runs at 30fps, this prototype at 60fps, so every
// per-frame constant from the game (walktimer, walkbuffer, runtimer ramp)
// is halved to keep the exact same feel.
const FACING_DIR = ["d", "r", "u", "l"]; // 0=down 1=right 2=up 3=left
const DT = {
  facing: 2,      // global.facing
  idleLast: true, // no direction held last frame (the game's "nopress")
  walktimer: 0,
  walkbuffer: 0,
  runtimer: 0
};

function updatePlayer() {
  if (settings.walkMode === 1) { updatePlayerDT(); }
  else { updatePlayerClassic(); }
}

// Kris can walk on every tile in the room, including the black ones: in the
// original egg room the whole floor is open and only the room's edges bound
// movement. The tree's trunk/root solid (roomCollides) and the screen-edge
// clamps in the movement code still block him.
function kCollides(x, y) {
  const px = x + KRIS_OFF.x, py = y + KRIS_OFF.y;
  return roomCollides(px, py);
}

function updatePlayerClassic() {
  if (DLG.showing) { KRIS.moving = false; return; }
  let mx = 0, my = 0;
  if (held("arrowleft") || held("a")) mx -= 1;
  if (held("arrowright") || held("d")) mx += 1;
  if (held("arrowup") || held("w")) my -= 1;
  if (held("arrowdown") || held("s")) my += 1;
  KRIS.moving = (mx !== 0 || my !== 0);
  if (KRIS.moving) {
    if (mx !== 0 && my !== 0) { mx *= 0.7071; my *= 0.7071; }
    KRIS.dir = my < 0 ? "u" : my > 0 ? "d" : mx < 0 ? "l" : "r";
    const s = settings.walkSpeed * speedScale;
    const nx = KRIS.x + mx * s, ny = KRIS.y + my * s;
    if (!kCollides(nx, KRIS.y)) KRIS.x = nx;
    if (!kCollides(KRIS.x, ny)) KRIS.y = ny;
    KRIS.x = Math.max(16, Math.min(W - 16, KRIS.x));
    KRIS.y = Math.max(24, Math.min(H - 16, KRIS.y));
    KRIS.animT += speedScale;
    if (KRIS.animT >= 9) { KRIS.animT = 0; KRIS.anim = (KRIS.anim + 1) % 4; }
  } else {
    KRIS.animT = 0; KRIS.anim = 0;
  }
}

// port of obj_mainchara/Step_0.gml movement (chapter 2, light world):
// run boost, facing latch, wall-slide + diagonal-corner resolution, and the
// walktimer/walkbuffer animation cycle.
function updatePlayerDT() {
  if (DLG.showing) { KRIS.moving = false; return; }
  const nowx = KRIS.x, nowy = KRIS.y;

  const press_l = (held("arrowleft")  || held("a")) ? 1 : 0;
  const press_r = (held("arrowright") || held("d")) ? 1 : 0;
  const press_u = (held("arrowup")    || held("w")) ? 1 : 0;
  const press_d = (held("arrowdown")  || held("s")) ? 1 : 0;
  const nopress = !(press_l || press_r || press_u || press_d);

  // run = hold X or Shift (button2: input_k[5]=X, input_k[8]=Shift)
  const run = (held("x") || held("shift")) ? 1 : 0;

  // wspeed = bwspeed + run boost. The game adds +1/+2/+3 (30fps units);
  // scaled by walkSpeed/3 so the ratios stay 4/3, 5/3, 2x at 60fps.
  const boost = settings.walkSpeed / 3;
  let wspeed = settings.walkSpeed;
  if (run === 1) {
    wspeed = settings.walkSpeed + boost;
    if (DT.runtimer > 10) wspeed = settings.walkSpeed + 2 * boost;
    if (DT.runtimer > 60) wspeed = settings.walkSpeed + 3 * boost;
  }
  wspeed *= speedScale; // frame-rate normalization (1.0 at 60fps)

  let px = 0, py = 0, pressdir = -1;
  if (press_r === 1) { px = wspeed;  pressdir = 1; }
  if (press_l === 1) { px = -wspeed; pressdir = 3; }
  if (press_d === 1) { py = wspeed;  pressdir = 0; }
  if (press_u === 1) { py = -wspeed; pressdir = 2; }

  // facing latch: new press from idle snaps facing; otherwise facing only
  // changes when the opposite of the current axis is pressed, or the key
  // holding the current axis is released.
  if (DT.idleLast && pressdir !== -1) { DT.facing = pressdir; }
  if (DT.facing === 2) {
    if (press_d === 1) { DT.facing = 0; }
    if (press_u === 0 && pressdir !== -1) { DT.facing = pressdir; }
  }
  if (DT.facing === 0) {
    if (press_u === 1) { DT.facing = 2; }
    if (press_d === 0 && pressdir !== -1) { DT.facing = pressdir; }
  }
  if (DT.facing === 3) {
    if (press_r === 1) { DT.facing = 1; }
    if (press_l === 0 && pressdir !== -1) { DT.facing = pressdir; }
  }
  if (DT.facing === 1) {
    if (press_l === 1) { DT.facing = 3; }
    if (press_r === 0 && pressdir !== -1) { DT.facing = pressdir; }
  }

  let xmeet = 0, ymeet = 0, xymeet = 0;
  let bkx = 0, bky = 0, bkxy = 0;

  if (kCollides(KRIS.x + px, KRIS.y + py)) { xymeet = 1; }
  // X axis: slide vertically along the wall, then snap px to a free spot
  if (kCollides(KRIS.x + px, KRIS.y)) {
    xmeet = 1; bkx = 0;
    for (let g = wspeed; g > 0; g -= 1) {
      if (press_d === 0 && !kCollides(KRIS.x + px, KRIS.y - g)) { KRIS.y -= g; py = 0; break; }
      if (press_u === 0 && !kCollides(KRIS.x + px, KRIS.y + g)) { KRIS.y += g; py = 0; break; }
    }
    if (px > 0) { for (let i = px; i >= 0; i -= 1) { if (!kCollides(KRIS.x + i, KRIS.y)) { px = i; bkx = 1; break; } } }
    if (px < 0) { for (let i = px; i <= 0; i += 1) { if (!kCollides(KRIS.x + i, KRIS.y)) { px = i; bkx = 1; break; } } }
    if (bkx === 0) { px = 0; }
  }
  // Y axis: slide horizontally along the wall, then snap py to a free spot
  if (kCollides(KRIS.x, KRIS.y + py)) {
    ymeet = 1; bky = 0;
    for (let g = wspeed; g > 0; g -= 1) {
      if (press_r === 0 && !kCollides(KRIS.x - g, KRIS.y + py)) { KRIS.x -= g; px = 0; break; }
      if (press_l === 0 && !kCollides(KRIS.x + g, KRIS.y + py)) { KRIS.x += g; px = 0; break; }
    }
    if (py > 0) { for (let i = py; i >= 0; i -= 1) { if (!kCollides(KRIS.x, KRIS.y + i)) { py = i; bky = 1; break; } } }
    if (py < 0) { for (let i = py; i <= 0; i += 1) { if (!kCollides(KRIS.x, KRIS.y + i)) { py = i; bky = 1; break; } } }
    if (bky === 0) { py = 0; }
  }
  // diagonal corner resolution: shrink the displacement toward (0,0)
  if (kCollides(KRIS.x + px, KRIS.y + py)) {
    xymeet = 1; bkxy = 0;
    let i = px, j = py;
    while (j !== 0 || i !== 0) {
      if (!kCollides(KRIS.x + i, KRIS.y + j)) { px = i; py = j; bkxy = 1; break; }
      if (Math.abs(j) >= 1) { j = j > 0 ? j - 1 : j + 1; } else { j = 0; }
      if (Math.abs(i) >= 1) { i = i > 0 ? i - 1 : i + 1; } else { i = 0; }
    }
    if (bkxy === 0) { px = 0; py = 0; }
  }

  // run timer ramps while running, moving, and free of walls
  let runmove = 0;
  if (run === 1 && xmeet === 0 && ymeet === 0 && xymeet === 0) {
    if (px !== 0 || py !== 0) { runmove = 1; DT.runtimer += 0.5 * speedScale; }
    else { DT.runtimer = 0; }
  } else {
    DT.runtimer = 0;
  }

  KRIS.x += px;
  KRIS.y += py;
  KRIS.x = Math.max(16, Math.min(W - 16, KRIS.x));
  KRIS.y = Math.max(24, Math.min(H - 16, KRIS.y));
  KRIS.dir = FACING_DIR[DT.facing];

  // walk animation cycle (Deltarune constants halved for 60fps, time-normalized)
  let walk = 0;
  if ((KRIS.x !== nowx || KRIS.y !== nowy) && !DT.idleLast) { walk = 1; }
  if (walk === 1) { DT.walkbuffer = 6; }
  if (DT.walkbuffer > 3) {
    DT.walktimer += 0.75 * speedScale;
    if (runmove === 1) { DT.walktimer += 0.75 * speedScale; }
    if (DT.walktimer >= 40) { DT.walktimer -= 40; }
    if (DT.walktimer < 10) { KRIS.anim = 0; }
    else if (DT.walktimer < 20) { KRIS.anim = 1; }
    else if (DT.walktimer < 30) { KRIS.anim = 2; }
    else { KRIS.anim = 3; }
  }
  if (DT.walkbuffer <= 0) {
    if (DT.walktimer < 10) { DT.walktimer = 9.5; }
    else if (DT.walktimer < 20) { DT.walktimer = 19.5; }
    else if (DT.walktimer < 30) { DT.walktimer = 29.5; }
    else { DT.walktimer = 39.5; }
    KRIS.anim = 0;
  }
  DT.walkbuffer -= 0.375 * speedScale;
  DT.idleLast = nopress;
  KRIS.moving = walk === 1;
}

function facingToward(x, y) {
  const dx = x - KRIS.x, dy = y - KRIS.y;
  if (KRIS.dir === "u") return dy < 0 && Math.abs(dx) < 52;
  if (KRIS.dir === "d") return dy > 0 && Math.abs(dx) < 52;
  if (KRIS.dir === "l") return dx < 0 && Math.abs(dy) < 52;
  return dx > 0 && Math.abs(dy) < 52;
}

function nearMan() {
  if (state.manGone) return false; // after he leaves, the tree gets its own dialogue
  // The man is behind the tree: he can only be talked to from beside/behind
  // it (above the green box's level), while facing his trigger. This mirrors
  // obj_mainchara's direction-specific collision rectangles.
  if (KRIS.y >= COLLBOX.y + COLLBOX.h - 8) return false;
  const dx = KRIS.x - MAN_POS.x, dy = KRIS.y - MAN_POS.y;
  return dx * dx + dy * dy < 62 * 62 && facingToward(MAN_POS.x, MAN_POS.y - MAN_H / 3);
}
function nearTreeBack() {
  // In front of the tree: the band below the green collision box, across the
  // tree's width (box is tunable in the [I] editor; this zone follows it).
  return KRIS.dir === "u" &&
         KRIS.x > COLLBOX.x - 10 && KRIS.x < COLLBOX.x + COLLBOX.w + 10 &&
         KRIS.y > COLLBOX.y + COLLBOX.h - 10 && KRIS.y < COLLBOX.y + COLLBOX.h + 12;
}

function handleInteract() {
  if (DLG.showing || !anyKey(["z", "enter", " "])) return false;
  // In front of the tree this is a tree; the man is only talked to from
  // beside/behind it, so the tree zone gets priority.
  if (nearTreeBack()) { treeInteract(); startDialogue(); return true; }
  if (nearMan()) { manInteract(); startDialogue(); return true; }
  return false;
}

function handleChoiceInput() {
  if (!DLG.showing || !DLG.page.choices || DLG.choice !== -1) return false;
  if (DLG.typing) return false; // Z while typing only finishes the text (Deltarune behavior)
  const c = DLG.page.choices;
  let next = -1;
  if (anyKey(["arrowleft", "a"])) next = 0;
  else if (c.length > 1 && anyKey(["arrowright", "d"])) next = 1;
  else if (c.length > 2 && anyKey(["arrowup", "w"])) next = 2;
  else if (c.length > 3 && anyKey(["arrowdown", "s"])) next = 3;
  let selectionChanged = false;
  if (next !== -1 && next !== DLG.choiceSel) {
    DLG.choiceSel = next;
    selectionChanged = true;
    playSound(cursorEl, 0.6);
  }
  // obj_choicer_neo checks confirm before movement; keeping selection and
  // confirmation on separate frames prevents a carried key from auto-picking.
  if (!selectionChanged && DLG.choiceSel >= 0 && anyKey(["z", "enter", " "])) {
    playSound(cursorEl, 0.6);
    DLG.choice = DLG.choiceSel;
    dDone(); // choosing immediately closes the box and continues
    return true;
  }
  return selectionChanged;
}

function updateDialogue() {
  if (!DLG.showing) return;
  if (handleChoiceInput()) return;
  if (DLG.page.choices && DLG.choice === -1 && !DLG.typing) {
    return; // waiting for choice (text already typed out)
  }
  if (anyKey(["z", "enter", " "])) { dDone(); return; }
  if (DLG.typing) {
    // obj_writer/Alarm_0.gml port: the alarm counts down in 30fps game frames
    // (0.5 per render frame at 60fps), fires exactly one character step, then
    // resets to rate. ^N pauses add 5..150 extra frames, so the text types at
    // the original 30 characters per second with the original pause lengths.
    DLG.alarm -= 0.5 * speedScale;
    while (DLG.alarm <= 0 && DLG.typing && DLG.pos < DLG.page.text.length) {
      const extra = dTypeStep();
      if (DLG.alarm <= 0) DLG.alarm += DLG.rate + extra;
    }
    if (DLG.pos >= DLG.page.text.length) { DLG.typing = false; }
  }
}

// ^N pause durations from obj_writer/Alarm_0.gml, in 30fps game frames
// (^1 = 5 extra frames + the base rate = a ~0.2s beat).
const DLG_PAUSE_FRAMES = { 1: 5, 2: 10, 3: 15, 4: 20, 5: 30, 6: 40, 7: 60, 8: 90, 9: 150 };

// scr_textsound: no blip for spaces, punctuation, or control characters.
function isBlipChar(ch) {
  return !" \n&!.?,:/\\|*^".includes(ch);
}

// One writer alarm fire. Returns extra pause frames (0 normally) so the
// caller can add them to the alarm alongside the base rate.
function dTypeStep() {
  const t = DLG.page.text;
  const ch = t[DLG.pos];
  const nxt = t[DLG.pos + 1];
  if (ch === "^" && nxt >= "1" && nxt <= "9") {
    DLG.pos += 2;            // skip the caret and its pause digit
    DLG.pos += 1;            // the character after the code appears with the pause
    DLG.soundTimer = 0;
    return DLG_PAUSE_FRAMES[nxt];
  }
  if (ch === "/") {          // page break (normally stripped at page ends)
    DLG.pos++;
    DLG.typing = false;
    return -DLG.rate;
  }
  DLG.pos++;
  DLG.soundTimer--;
  if (DLG.soundTimer <= 0 && isBlipChar(ch)) {
    playSound(blipEl, 0.18);
    DLG.soundTimer = 2;      // every other character, like the original
  }
  return 0;
}

// Fixed page layout: the writer's format pass runs once at page open, so the
// typed prefix is revealed across pre-wrapped lines and words never jump
// between lines mid-typing.
function pageLayout(text) {
  const stripped = text.replace(/\^[1-9]/g, "");
  return { lines: wrapDialogueText(stripped, DARKBOX.x1 - 58 - 20, 2) };
}

function visibleText() {
  const t = DLG.page.text;
  let out = "";
  for (let i = 0; i < DLG.pos; i++) {
    const ch = t[i];
    if (ch === "^" && t[i + 1] >= "1" && t[i + 1] <= "9") { i++; continue; }
    out += ch;
  }
  return out;
}

/* ---------------- render ---------------- */
function drawPlayer() {
  const set = krisSets[settings.krisSet];
  if (!set) return;
  const frame = KRIS.anim;
  const spr = set[KRIS.dir][frame];
  if (!spr) return;
  const playerScale = 1.5;
  const dw = spr.width * playerScale;
  const dh = spr.height * playerScale;
  ctx.drawImage(spr, Math.round(KRIS.x) - dw / 2, Math.round(KRIS.y) - dh, dw, dh);
}

let floorCanvas = null;

function buildFloorCanvas() {
  const c = document.createElement("canvas");
  c.width = W;
  c.height = H;
  const cc = c.getContext("2d");
  // Rasterize at the native 640x360 resolution so every floor edge lands on
  // a whole pixel before the finished layer is nearest-neighbor scaled.
  cc.fillStyle = "#000";
  cc.fillRect(0, 0, W, H);
  cc.fillStyle = "#612c62";
  cc.fillRect(FLOOR.tx, FLOOR.ty, FLOOR.tw, FLOOR.th);
  cc.fillRect(FLOOR.hx, FLOOR.hy, FLOOR.hw, FLOOR.hh);
  cc.fillRect(FLOOR.mx, FLOOR.my, FLOOR.mw, FLOOR.mh);
  cc.fillRect(FLOOR.vx, FLOOR.vy, FLOOR.vw, FLOOR.vh);
  return c;
}

function drawFloor() {
  if (!floorCanvas) floorCanvas = buildFloorCanvas();
  ctx.drawImage(floorCanvas, 0, 0, W, H);
}

function drawMan() {
  // The man: a white silhouette (in the game he is a stretched 1x1 white pixel).
  if (!settings.manVisible) return; // invisible but still talkable
  const x = Math.round(MAN_POS.x), y = Math.round(MAN_POS.y);
  ctx.fillStyle = "#ffffff";
  // head
  roundRect(ctx, x - 6, y - 46, 12, 13, 6); ctx.fill();
  // body
  roundRect(ctx, x - 8, y - 33, 16, 33, 7); ctx.fill();
}

function updateTreeFx() {
  const dt30 = 0.5 * speedScale;
  TREE_FX.siner += dt30;
  TREE_FX.blocktimer += dt30;

  // obj_blocktree_bg creates one block at frame 20, fades it in through 30,
  // fades it out from 38, and resets the whole cycle at 48.
  if (!TREE_FX.block && TREE_FX.blocktimer >= 20 && TREE_FX.blocktimer < 20 + dt30 + 0.001) {
    const t = TREES[3];
    const dw = (t && t.img ? t.img.width * TREE.z : 162);
    const dh = (t && t.img ? t.img.height * TREE.z : 139.5);
    TREE_FX.block = {
      x: TREE.x - dw / 2 + dw / 4 + Math.random() * (dw / 2),
      y: TREE.y - dh + dh / 4 + Math.random() * (dh / 4),
      vx: 0.4 + Math.random(),
      // Original Deltarune code: vspeed = 0.7 + random(1.5). Tuned a bit
      // lower (0.4..1.3) so the leaves drift down more gently.
      vy: 0.4 + Math.random() * 0.9,
      alpha: 0
    };
  }

  const b = TREE_FX.block;
  if (b) {
    b.x += b.vx * dt30;
    b.y += b.vy * dt30;
    // GameMaker friction=-0.1 accelerates along the current direction, while
    // gravity_direction=0 adds a rightward pull.
    const speed = Math.hypot(b.vx, b.vy);
    if (speed > 0) {
      const faster = (speed + 0.1 * dt30) / speed;
      b.vx *= faster; b.vy *= faster;
    }
    b.vx += 0.1 * dt30;
    if (TREE_FX.blocktimer <= 30 && b.alpha < 1) b.alpha = Math.min(1, b.alpha + 0.2 * dt30);
    if (TREE_FX.blocktimer >= 38) b.alpha = Math.max(0, b.alpha - 0.1 * dt30);
  }

  if (TREE_FX.blocktimer >= 48) {
    TREE_FX.blocktimer %= 48;
    TREE_FX.block = null;
  }
}

function drawAnimatedBlockTree(t) {
  if (!img.blockTreeTrunk || !img.blockTreeLeavesBack || !img.blockTreeLeavesFront) return false;
  // Match the footprint of the selected flattened reference while drawing the
  // real 105x91 component sprites at a single shared origin.
  const dw = t.img.width * TREE.z, dh = t.img.height * TREE.z;
  const left = Math.round(TREE.x) - dw / 2;
  const top = TREE.y - dh;
  ctx.drawImage(img.blockTreeTrunk, left, top, dw, dh);
  ctx.drawImage(img.blockTreeLeavesBack,
                left + Math.sin(TREE_FX.siner / 12) * 2,
                top + Math.cos(TREE_FX.siner / 20) * 2, dw, dh);
  ctx.drawImage(img.blockTreeLeavesFront,
                left + Math.sin(TREE_FX.siner / 14),
                top + Math.cos(TREE_FX.siner / 24), dw, dh);
  if (TREE_FX.block && img.blockTreeFalling) {
    ctx.save();
    ctx.globalAlpha = TREE_FX.block.alpha;
    const s = 1.5;
    ctx.drawImage(img.blockTreeFalling, TREE_FX.block.x, TREE_FX.block.y,
                  img.blockTreeFalling.width * s, img.blockTreeFalling.height * s);
    ctx.restore();
  }
  return true;
}

function drawTreeAndMan() {
  // the selected egg-room tree (cycle with O + number keys, position with P)
  const t = TREES[state.treeSel];
  // The man occupies the background layer and should never cover the tree.
  if (!state.manGone) { drawMan(); }
  if (t && t.img) {
    if (state.treeSel === 3 && drawAnimatedBlockTree(t)) return;
    const dw = t.img.width * TREE.z, dh = t.img.height * TREE.z;
    if (t.flipX) {
      ctx.save();
      ctx.translate(Math.round(TREE.x), 0);
      ctx.scale(-1, 1);
      ctx.drawImage(t.img, -dw / 2, TREE.y - dh, dw, dh);
      ctx.restore();
    } else {
      ctx.drawImage(t.img, Math.round(TREE.x) - dw / 2, TREE.y - dh, dw, dh);
    }
  }
}

function drawMoveMode() {
  if (!state.moveMode) return;
  ctx.fillStyle = "rgba(0,0,0,0.82)";
  ctx.fillRect(0, 0, W, H);
  drawText("TREE POSITIONING", 22, 40, "#fff");
  drawText("Arrows: move 1px   +/-: scale   Esc/P: done", 22, 58, "#aaa");
  drawText("x = " + Math.round(TREE.x), 22, 100, "#fff");
  drawText("y = " + Math.round(TREE.y), 22, 122, "#fff");
  drawText("z (scale) = " + TREE.z, 22, 144, "#fff");
}

function playerBehindTree() {
  // Depth line: above trunkTop's screen position Kris is drawn behind the
  // tree, below it in front. Move the yellow line with [I] + arrows (trunkTop).
  const t = TREES[state.treeSel];
  const lineY = (t && t.trunkCollision && t.img)
    ? TREE.y - t.img.height * TREE.z + (t.trunkTop || 185) * TREE.z
    : TREE.y - 4;
  return KRIS.y < lineY;
}

const DARKBOX = { x0: 24, y0: H - 168, x1: W - 24, y1: H - 2 };

function drawImageFlipped(sprite, x, y, w, h, flipX, flipY) {
  if (!sprite) return;
  ctx.save();
  ctx.translate(x + (flipX ? w : 0), y + (flipY ? h : 0));
  ctx.scale(flipX ? -1 : 1, flipY ? -1 : 1);
  ctx.drawImage(sprite, 0, 0, w, h);
  ctx.restore();
}

function drawOfficialDarkBox() {
  const { x0, y0, x1, y1 } = DARKBOX;
  ctx.fillStyle = "#000";
  ctx.fillRect(x0 + 20, y0 + 20, x1 - x0 - 40, y1 - y0 - 40);

  const stretchW = x1 - x0 - 63;
  const stretchH = y1 - y0 - 63;
  if (!img.darkboxTop || !img.darkboxLeft || !img.darkboxCorners) {
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 4;
    ctx.strokeRect(x0 + 2, y0 + 2, x1 - x0 - 4, y1 - y0 - 4);
    return;
  }

  ctx.drawImage(img.darkboxTop, x0 + 32, y0, stretchW, 32);
  drawImageFlipped(img.darkboxTop, x0 + 32, y1 + 1 - 32, stretchW, 32, false, true);
  ctx.drawImage(img.darkboxLeft, x0, y0 + 32, 32, stretchH);
  drawImageFlipped(img.darkboxLeft, x1 + 1 - 32, y0 + 32, 32, stretchH, true, false);

  const frame = Math.floor(performance.now() / (1000 / 30 * 10)) % img.darkboxCorners.length;
  const corner = img.darkboxCorners[frame];
  ctx.drawImage(corner, x0, y0, 32, 32);
  drawImageFlipped(corner, x1 + 1 - 32, y0, 32, 32, true, false);
  drawImageFlipped(corner, x0, y1 + 1 - 32, 32, 32, false, true);
  drawImageFlipped(corner, x1 + 1 - 32, y1 + 1 - 32, 32, 32, true, true);
}

function wrapDialogueText(text, maxWidth, scale) {
  if (!text) return [];
  const lines = [];
  let line = "";
  for (const word of text.split(/(\s+)/)) {
    if (word.includes("\n")) {
      for (const part of word.split("\n")) {
        if (part) line += part;
        lines.push(line.trimEnd());
        line = "";
      }
      continue;
    }
    const candidate = line + word;
    if (line.trim().length > 0 && textWidth(candidate) * scale > maxWidth) {
      lines.push(line.trimEnd());
      line = word.trimStart();
    } else {
      line = candidate;
    }
  }
  if (line.length || lines.length === 0) lines.push(line.trimEnd());
  return lines;
}

function drawOfficialChoices(options) {
  const centersX = [155, 487, 321, 327];
  const centersY = [DARKBOX.y0 + 81, DARKBOX.y0 + 81,
                    DARKBOX.y0 + 41, DARKBOX.y0 + 120];
  for (let i = 0; i < options.length; i++) {
    const label = options[i];
    const width = textWidth(label) * 2;
    drawTextScaled(label, centersX[i] - width / 2, centersY[i] - 16,
                   i === DLG.choiceSel ? "#ffff00" : "#fff", 2);
  }

  let targetX = 312;
  let targetY = DARKBOX.y0 + 74;
  if (DLG.choiceSel >= 0) {
    const labelWidth = textWidth(options[DLG.choiceSel]) * 2;
    targetX = centersX[DLG.choiceSel] - labelWidth / 2 - 22;
    targetY = centersY[DLG.choiceSel] - 8;
  }
  DLG.heartX += (targetX - DLG.heartX) * 0.8;
  DLG.heartY += (targetY - DLG.heartY) * 0.8;
  if (img.choiceHeart) {
    ctx.drawImage(img.choiceHeart, Math.round(DLG.heartX), Math.round(DLG.heartY), 18, 18);
  }
}

function drawDialogueBox() {
  if (!DLG.showing || !DLG.page) return;
  // The room is enlarged 4/3 to fill its 854x480 canvas. At 75%, the UI's
  // final Chrome footprint is again Deltarune's native 592x166 pixels.
  const uiScale = DIALOG_SIZES[settings.dialogSize].scale;
  const pivotX = (DARKBOX.x0 + DARKBOX.x1) / 2;
  const pivotY = DARKBOX.y1;
  ctx.save();
  ctx.translate(pivotX, pivotY);
  ctx.scale(uiScale, uiScale);
  ctx.translate(-pivotX, -pivotY);
  drawOfficialDarkBox();

  const page = DLG.page;
  if (page.choices && !DLG.typing) {
    drawOfficialChoices(page.choices);
  } else {
    // Reveal the typed prefix across the pre-wrapped fixed lines (Deltarune
    // formats each page once, so the layout never reflows mid-typing).
    const layout = DLG.layout || pageLayout(page.text);
    const shown = visibleText().length;
    let prev = 0, y = DARKBOX.y0 + 28;
    for (let i = 0; i < layout.lines.length && i < 3; i++) {
      const take = Math.max(0, Math.min(layout.lines[i].length, shown - prev));
      if (take > 0) drawTextScaled(layout.lines[i].slice(0, take), 58, y, "#fff", 2);
      prev += layout.lines[i].length;
      y += 36;
    }
  }
  ctx.restore();
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);
  c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r);
  c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r);
  c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}

function drawHud() {
  if (state.gotEgg && img.egg) {
    // key item: EGG
    const bx = W - 118, by = 12, bw = 106, bh = 30;
    ctx.fillStyle = "rgba(0,0,0,0.65)";
    roundRect(ctx, bx, by, bw, bh, 6); ctx.fill();
    ctx.drawImage(img.egg, bx + 6, by + 6);
    drawText("EGG", bx + 34, by + 9, "#fff");
  }
  if (state.haveAlleggs && state.dbg) {
    ctx.fillStyle = "#fff";
    drawText("DEBUG: carrying all 4 eggs", 12, 14, "#fff");
  }
  if (state.started && state.dbg) { drawTreeHudLines(); }
}

function drawTreeHudLines() {
  drawText("Tree " + (state.treeSel + 1) + "/" + TREES.length + ": " + TREES[state.treeSel].name, 12, 30, "#aaa");
  drawText("[O] pick a tree   [P] move tree", 12, 46, "#888");
  if (settings.walkMode === 1) { drawText("X/Shift: run   (Deltarune walk code)", 12, 62, "#888"); }
}

// [I] collision debug: solid alpha pixels for alternate trees (red), the egg
// room trunk/root box (green), man solid (cyan), trunk
// line (yellow), Kris's collision point + body (red), man (cyan), live numbers.
// Shape editor: [ ] pick a shape, arrows move it, Shift+arrows resize, R reset.
function treeColOverlay(t) {
  if (!t || !t.col || !t.col.w) return null;
  if (!t.ovCanvas) {
    const c = document.createElement("canvas");
    c.width = t.col.w; c.height = t.col.h;
    const cc = c.getContext("2d");
    const id = cc.createImageData(c.width, c.height);
    for (let i = 0; i < t.col.data.length; i++) {
      if (t.col.data[i] > 40) { id.data[i * 4] = 255; id.data[i * 4 + 3] = 150; }
    }
    cc.putImageData(id, 0, 0);
    t.ovCanvas = c;
  }
  return t.ovCanvas;
}

function shapeReport(id) {
  const t = TREES[state.treeSel];
  if (id === "box") {
    return "box x=" + COLLBOX.x + " y=" + COLLBOX.y + " w=" + COLLBOX.w + " h=" + COLLBOX.h +
           " (x " + COLLBOX.x + ".." + (COLLBOX.x + COLLBOX.w) + ", y " + COLLBOX.y + ".." + (COLLBOX.y + COLLBOX.h) + ")";
  }
  if (id === "trunkTop") {
    const y = t.img ? TREE.y - t.img.height * TREE.z + (t.trunkTop || 185) * TREE.z : -1;
    return "trunkTop row=" + (t.trunkTop ?? "-") + " (screen y=" + Math.round(y) + ")";
  }
  if (id === "kris") return "kris offset dx=" + KRIS_OFF.x + " dy=" + KRIS_OFF.y;
  if (id === "man") return "man x=" + MAN_POS.x + " y=" + MAN_POS.y + " (" + MAN_W + "x" + MAN_H + ")";
  return id;
}

function resetShape(id) {
  if (id === "box") {
    COLLBOX.x = 298; COLLBOX.y = 185;
    COLLBOX.w = 64; COLLBOX.h = 24;
  } else if (id === "trunkTop") {
    const t = TREES[state.treeSel];
    if (t.trunkCollision) t.trunkTop = 185;
  } else if (id === "kris") {
    KRIS_OFF.x = 0; KRIS_OFF.y = 0;
  } else if (id === "man") {

function drawCollisionDebug() {
  if (!state.colDbg || !state.started) return;
  const t = TREES[state.treeSel];
  // Alternate selectable trees use alpha collision. The animated egg-room
  // tree intentionally does not: only its green trunk/root box is solid.
  if (t && !t.trunkCollision && t.img && t.col) {
    const ov = treeColOverlay(t);
    if (ov) {
      ctx.save();
      ctx.globalAlpha = 0.45;
      const dw = t.img.width * TREE.z, dh = t.img.height * TREE.z;
      if (t.flipX) {
        ctx.translate(Math.round(TREE.x), 0);
        ctx.scale(-1, 1);
        ctx.drawImage(ov, -dw / 2, TREE.y - dh, dw, dh);
      } else {
        ctx.drawImage(ov, Math.round(TREE.x) - dw / 2, TREE.y - dh, dw, dh);
      }
      ctx.restore();
    }
  }
  if (t && t.trunkCollision) {
    // green collision box: SOLID (blocks Kris)
    ctx.fillStyle = "rgba(80,255,120,0.30)";
    ctx.fillRect(COLLBOX.x, COLLBOX.y, COLLBOX.w, COLLBOX.h);
    ctx.strokeStyle = debugSel === "box" ? "#ffffff" : "#7fff9a";
    ctx.lineWidth = debugSel === "box" ? 2 : 1;
    ctx.strokeRect(COLLBOX.x - 0.5, COLLBOX.y - 0.5, COLLBOX.w + 1, COLLBOX.h + 1);
    // tree talk zone (Z in front of the tree) - follows the box
    ctx.strokeStyle = "rgba(255,255,255,0.55)";
    ctx.setLineDash([3, 3]);
    ctx.strokeRect(COLLBOX.x - 10, COLLBOX.y + COLLBOX.h - 10, COLLBOX.w + 20, 22);
    ctx.setLineDash([]);
    // trunk line: first sprite row of the solid trunk
    const trunkY = TREE.y - t.img.height * TREE.z + (t.trunkTop || 185) * TREE.z;
    ctx.fillStyle = debugSel === "trunkTop" ? "#ffffff" : "#ffd23f";
    ctx.fillRect(0, trunkY, W, debugSel === "trunkTop" ? 2 : 1);
  }
  // man interaction guide (cyan outline only; it does not block movement)
  ctx.strokeStyle = debugSel === "man" ? "#ffffff" : "#4fd2ff";
  ctx.lineWidth = debugSel === "man" ? 2 : 1;
  ctx.strokeRect(MAN_POS.x - MAN_W / 2, MAN_POS.y - MAN_H, MAN_W, MAN_H);
  // Kris: collision point (feet + offset) + real sprite body box
  const kx = Math.round(KRIS.x + KRIS_OFF.x), ky = Math.round(KRIS.y + KRIS_OFF.y);
  ctx.fillStyle = debugSel === "kris" ? "#ffffff" : "#ff5555";
  ctx.beginPath();
  ctx.arc(kx, ky, debugSel === "kris" ? 4 : 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#ff5555";
  const set = krisSets[settings.krisSet];
  if (set && set[KRIS.dir]) {
    const spr = set[KRIS.dir][KRIS.anim];
    if (spr) {
      const pw = spr.width * 1.5, ph = spr.height * 1.5;
      ctx.strokeRect(Math.round(KRIS.x) - pw / 2, Math.round(KRIS.y) - ph, pw, ph);
    }
  } else {
    ctx.strokeRect(kx - 6, ky - 34, 12, 34);
  }
  // live numbers
  const cx = 12;
  let y = 80;
  drawText("COLLISION DEBUG  [I] hide   shape: " + (debugSel === null ? "none" : debugSel.toUpperCase()), cx, y, "#fff"); y += 16;
  drawText("Kris: " + Math.round(KRIS.x) + ", " + Math.round(KRIS.y) +
           "   off " + KRIS_OFF.x + ", " + KRIS_OFF.y, cx, y, "#fff"); y += 14;
  drawText("  collide=" + (roomCollides(KRIS.x + KRIS_OFF.x, KRIS.y + KRIS_OFF.y) ? "YES" : "no") +
           "  floor=" + (floorContains(KRIS.x, KRIS.y) ? "YES" : "no"), cx, y, "#888"); y += 14;
  drawText("  behindTree=" + (playerBehindTree() ? "YES" : "no") +
           "  nearMan=" + (nearMan() ? "YES" : "no"), cx, y, "#888"); y += 14;
  drawText("Tree: " + Math.round(TREE.x) + ", " + Math.round(TREE.y) +
           "  z=" + TREE.z, cx, y, "#fff"); y += 14;
  if (t.trunkCollision) {
    const lineY = TREE.y - t.img.height * TREE.z + (t.trunkTop || 185) * TREE.z;
    drawText("  sel=" + (state.treeSel + 1) + "/" + TREES.length +
             "  trunkTop=" + t.trunkTop + " (depth y=" + Math.round(lineY) + ")", cx, y, "#888"); y += 14;
  } else {
    drawText("  sel=" + (state.treeSel + 1) + "/" + TREES.length + "  full alpha", cx, y, "#888"); y += 14;
  }
  if (t.trunkCollision) {
    drawText("Box: x " + COLLBOX.x + ".." + (COLLBOX.x + COLLBOX.w) +
             "  y " + COLLBOX.y + ".." + (COLLBOX.y + COLLBOX.h) +
             "  (" + COLLBOX.w + "x" + COLLBOX.h + ") SOLID", cx, y, "#888"); y += 14;
  }

           "  (" + MAN_W + "x" + MAN_H + ")", cx, y, "#888"); y += 14;
  drawText("EDIT: [ ] shape  arrows move (4px)  Shift+arrows size  R reset  (WASD moves Kris)", cx, y + 2, "#aaa");

// detailed collision logs for testing (only while the [I] overlay is on)
function traceCollision() {
  if (!state.colDbg) return;
  const x = KRIS.x + KRIS_OFF.x, y = KRIS.y + KRIS_OFF.y;
  const t = TREES[state.treeSel];
  const inBox = !!(t && t.trunkCollision) &&
                x > COLLBOX.x && x < COLLBOX.x + COLLBOX.w &&
                y > COLLBOX.y && y < COLLBOX.y + COLLBOX.h;
  const inTree = roomCollides(x, y);
  const behind = playerBehindTree();
  const near = nearMan();
  if (inBox !== COL_TRACE.box) {
    COL_TRACE.box = inBox;
    colLog("Kris " + (inBox ? "ENTERED" : "LEFT") + " collision box @ (" + Math.round(x) + "," + Math.round(y) +
           ")  off=(" + KRIS_OFF.x + "," + KRIS_OFF.y + ")");
  }
  if (inTree !== COL_TRACE.tree) {
    COL_TRACE.tree = inTree;
    colLog("Kris " + (inTree ? "BLOCKED by collision" : "clear of collision") +
           " @ (" + Math.round(x) + "," + Math.round(y) + ")");
  }
  if (behind !== COL_TRACE.behind) {
    COL_TRACE.behind = behind;
    colLog("Kris " + (behind ? "now BEHIND tree" : "now IN FRONT of tree") + " @ y=" + Math.round(y));

  if (near !== COL_TRACE.nearMan) {
    COL_TRACE.nearMan = near;
    colLog("Kris " + (near ? "within man talk range" : "out of man range") +
           " dist=" + Math.round(Math.hypot(KRIS.x - MAN_POS.x, KRIS.y - MAN_POS.y)));

}

const menuButtons = []; // {x,y,w,h,label,action} rebuilt each frame
const MENU_UI = { scale: 1, x: 0, y: 0 };

function addMenuBtn(x, y, w, label, action) {
  menuButtons.push({
    x: MENU_UI.x + x * MENU_UI.scale,
    y: MENU_UI.y + y * MENU_UI.scale,
    w: w * MENU_UI.scale,
    h: 20 * MENU_UI.scale,
    label, action

function handleMenuClick(mx, my) {
  if (state.started) return;
  for (const b of menuButtons) {
    if (mx >= b.x && mx <= b.x + b.w && my >= b.y - 4 && my <= b.y + b.h + 4) {
      playSound(cursorEl, 0.5);
      b.action();
      return;
    }
  }
  if (state.menu === "title") { startGame(); return; }
}

function resetRoomRun() {
  state.manGone = false;
  state.manLeaving = false;
  state.gotEgg = false;
  state.talked = 0;
  state.completedRun = false;
  state.treeSelMode = false;
  state.moveMode = false;
  KRIS.x = 320; KRIS.y = 333; KRIS.dir = "u";
  KRIS.moving = false; KRIS.anim = 0; KRIS.animT = 0;
  DT.facing = 2; DT.idleLast = true;
  DT.walktimer = 0; DT.walkbuffer = 0; DT.runtimer = 0;
  TREE_FX.siner = 0; TREE_FX.blocktimer = 0; TREE_FX.block = null;
  DLG.queue.length = 0; DLG.showing = false; DLG.page = null;

function startGame() {
  if (state.completedRun) resetRoomRun();
  state.started = true;
  musicEl.play().catch(() => {});
  state.fade = 0; state.fadeTo = 0;
}

function exitRoomToMenu() {
  state.started = false;
  state.completedRun = true;
  state.menu = "title";
  state.menuSel = 0;
  KRIS.moving = false;
  if (musicEl) { musicEl.pause(); musicEl.currentTime = 0; }
  for (const key of Object.keys(keys)) keys[key] = false;
  for (const key of Object.keys(PRESSED)) PRESSED[key] = false;
}

function tryExitRoom() {
  if (!state.gotEgg || DLG.showing) return false;
  const leaving = held("arrowdown") || held("s");
  const inDoorway = KRIS.x >= FLOOR.vx + 7 &&
                    KRIS.x <= FLOOR.vx + FLOOR.vw - 7;
  if (leaving && inDoorway && KRIS.y >= H - 18) {
    exitRoomToMenu();
    return true;
  }
  return false;
}

/* ---------------- main loop ---------------- */
let raf = null;
let lastT = 0;
// Frame-rate normalization. Deltarune is locked to 30fps, so all of its
// per-frame constants assume a fixed rate. The browser runs this canvas at
// the display refresh (e.g. 60Hz, 120Hz, 144Hz, 165Hz), so every per-frame
// value is multiplied by speedScale = actualFrameRate / 60 (1.0 at 60fps)
// to keep the game feeling identical on any monitor. Design units in the
// settings are "per frame at 60fps".
let speedScale = 1;
function frame(ts) {
  if (ts > 0) {
    if (lastT > 0) {
      speedScale = Math.min(3, Math.max(0.1, ((ts - lastT) / 1000) * 60));
    } else {
      speedScale = 1;
    }
    lastT = ts;
  }
  if (!state.started) { handleMenuKeys(); }
  document.body.classList.toggle("room-active",
    state.started || (state.menu === "title" && settings.menuStyle === 1));
  if (state.started && !state.treeSelMode && !state.moveMode) {
    const openedDialogue = handleInteract();
    if (!tryExitRoom()) {
      updatePlayer();
      // The key that opened the box must not also finish its first page.
      if (!openedDialogue) updateDialogue();
    }
  }
  updateTreeFx();
  traceCollision();
  ctx.save();
  ctx.scale(RENDER_SCALE, RENDER_SCALE);
  drawFloor();
  if (playerBehindTree()) { drawPlayer(); drawTreeAndMan(); }
  else { drawTreeAndMan(); drawPlayer(); }
  drawHud();
  drawTreeSelector();
  drawMoveMode();
  drawCollisionDebug();
  drawDialogueBox();
  ctx.restore();
  drawTitle();
  clearPressed();
  // fade in
  if (state.fade > 0) {
    ctx.fillStyle = "rgba(0,0,0," + state.fade + ")";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    state.fade = Math.max(0, state.fade - 0.02 * speedScale);
  }
  raf = requestAnimationFrame(frame);
}

/* ---------------- boot ---------------- */
function loadImage(src) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => rej(new Error("failed to load " + src));
    im.src = src;
  });
}

// cut a sprite region out of a tileset/sheet
function cropImage(src, rect) {
  const c = document.createElement("canvas");
  c.width = rect.w; c.height = rect.h;
  const cc = c.getContext("2d");
  cc.drawImage(src, rect.x, rect.y, rect.w, rect.h, 0, 0, rect.w, rect.h);
  return c;
}

// per-pixel alpha bitmap for collision (1 byte per pixel)
function buildCollision(sprite) {
  try {
    const c = document.createElement("canvas");
    c.width = sprite.width; c.height = sprite.height;
    const cc = c.getContext("2d");
    cc.drawImage(sprite, 0, 0);
    if (!cc.getImageData) return null;
    const id = cc.getImageData(0, 0, c.width, c.height);
    if (!id || !id.data) return null;
    const data = new Uint8Array(c.width * c.height);
    for (let i = 0, j = 3; i < data.length; i++, j += 4) data[i] = id.data[j];
    return { w: c.width, h: c.height, data };
  } catch (e) { return null; }
}

  const [eggImg, crackedLogoImg, darkboxTopImg, darkboxLeftImg, choiceHeartImg,
    blockTrunkImg, blockBackImg, blockFrontImg, blockFallImg, fontImg] = await Promise.all([
    loadImage(ASSETS.egg),
    loadImage(ASSETS.crackedLogo),
    loadImage(DARKBOX_ASSETS.top),
    loadImage(DARKBOX_ASSETS.left),
    loadImage(DARKBOX_ASSETS.heart),
    loadImage(BLOCKTREE_ASSETS.trunk),
    loadImage(BLOCKTREE_ASSETS.leavesBack),
    loadImage(BLOCKTREE_ASSETS.leavesFront),
    loadImage(BLOCKTREE_ASSETS.fallingBlock),
    loadImage(ASSETS.font)
  ]);
  img.egg = eggImg;
  img.crackedLogo = crackedLogoImg;
  img.darkboxTop = darkboxTopImg;
  img.darkboxLeft = darkboxLeftImg;
  img.choiceHeart = choiceHeartImg;
  img.blockTreeTrunk = blockTrunkImg;
  img.blockTreeLeavesBack = blockBackImg;
  img.blockTreeLeavesFront = blockFrontImg;
  img.blockTreeFalling = blockFallImg;
  img.font = fontImg;
  img.darkboxCorners = await Promise.all(DARKBOX_ASSETS.corners.map(loadImage));
  const treeRaws = await Promise.all(TREES.map((t) => loadImage(t.file)));
  for (let i = 0; i < TREES.length; i++) {
    const raw = treeRaws[i];
    TREES[i].img = TREES[i].crop ? cropImage(raw, TREES[i].crop) : raw;
    TREES[i].col = buildCollision(TREES[i].img);
  }
  parseFontCsv(GLYPH_CSV);
  fontAtlasBlack = tintAtlas("#000000");
  fontAtlasWhite = tintAtlas("#ffffff");
  fontAtlasGray = tintAtlas("#999999");
  fontAtlasRed = tintAtlas("#ff6b6b");
  fontAtlasYellow = tintAtlas("#ffff00");

  // audio
  musicEl = makeEl(ASSETS.music, true);
  eggSfxEl = makeEl(ASSETS.eggSfx, false);
  blipEl = makeEl(ASSETS.blip, false);
  cursorEl = makeEl(ASSETS.cursor, false);

  // Autostarted audio may be blocked until the first real key press.
  window.addEventListener("keydown", () => {
    if (state.started && musicEl && musicEl.paused) musicEl.play().catch(() => {});
  }, { once: true });

  // mouse clicks on the title/settings menu
  canvas.addEventListener("click", e => {
    const r = canvas.getBoundingClientRect();
    const mx = (e.clientX - r.left) * (canvas.width / r.width);
    const my = (e.clientY - r.top) * (canvas.height / r.height);
    handleMenuClick(mx, my);
  });

  // debug: H toggles carrying all eggs
  // O opens the tree selector; 1-9/0 pick a tree; [ ] page; Esc closes
  // P opens tree positioning: arrows move it 1px per press, +/- scale, x/y/z shown
  window.addEventListener("keydown", e => {
    if (!state.started) return;
    const k = e.key.toLowerCase();
    if (k === "h" && !state.treeSelMode && !state.moveMode) {
      state.haveAlleggs = !state.haveAlleggs;
      state.dbg = true;
    }
    // I toggles the collision debug overlay (tree solids, green collision box,
    // Kris point). The box is auto-selected so arrow keys move it right away;
    // WASD still moves Kris. [ ] cycles shapes, including back to "none".
    if (k === "i" && !state.treeSelMode && !state.moveMode) {
      state.colDbg = !state.colDbg;
      debugSel = state.colDbg ? "box" : null;
      if (state.colDbg) {
        // fresh trace states so every transition logs this session
        COL_TRACE.box = COL_TRACE.tree = COL_TRACE.behind = COL_TRACE.nearMan = false;
        colLog("collision debug ON | shapes: box, trunkTop, kris, man | [ ] switch, arrows move (4px), Shift+arrows size, R reset | WASD moves Kris");
        colLog("current: " + shapeReport("box") + " | " + shapeReport("trunkTop") + " | " + shapeReport("man"));
      } else {
        if (KRIS_OFF.x !== 0 || KRIS_OFF.y !== 0) {
          KRIS_OFF.x = 0; KRIS_OFF.y = 0;
          colLog("kris offset reset to 0,0 (overlay off)");
        }
        colLog("collision debug OFF | arrows move Kris again");
      }
      // release any held arrow so a held key can't keep Kris walking mid-edit
      if (state.colDbg) for (const ak of ["arrowleft", "arrowright", "arrowup", "arrowdown"]) keys[ak] = false;
      return;
    }
    // shape editor: [ ] pick a shape, arrows move it, Shift+arrows resize, R reset
    if (state.colDbg && !state.treeSelMode && !state.moveMode) {
      const t = TREES[state.treeSel];
      if (k === "[" || k === "]") {
        const idx = debugSel === null ? 0 : DEBUG_SHAPES.indexOf(debugSel) + 1;
        debugSel = idx >= DEBUG_SHAPES.length ? null : DEBUG_SHAPES[idx];
        colLog("shape selected: " + (debugSel === null ? "none (arrows move Kris again)" : debugSel.toUpperCase() + " -> " + shapeReport(debugSel)));
        return;
      }
      if (debugSel !== null && k.indexOf("arrow") === 0) {
        const S = 4; // fast step: arrows move/resize 4px per press (repeat = hold)
        const d = k === "arrowleft" ? -S : k === "arrowright" ? S : 0;
        const d2 = k === "arrowup" ? -S : k === "arrowdown" ? S : 0;
        if (e.shiftKey) {
          if (debugSel === "box") {
            if (d !== 0) COLLBOX.w = Math.max(4, COLLBOX.w + d);
            if (d2 !== 0) COLLBOX.h = Math.max(4, COLLBOX.h + d2);
          } else if (debugSel === "man") {
            if (d !== 0) MAN_W = Math.max(4, MAN_W + d);
            if (d2 !== 0) MAN_H = Math.max(4, MAN_H + d2);
          }
        } else if (debugSel === "box") {
          COLLBOX.x += d; COLLBOX.y += d2;
        } else if (debugSel === "trunkTop") {
          // no upper clamp: as a layer line it can sit below the sprite
          if (t.trunkCollision) t.trunkTop = Math.max(0, t.trunkTop + d2 / S);
        } else if (debugSel === "kris") {
          KRIS_OFF.x += d; KRIS_OFF.y += d2;
        } else if (debugSel === "man") {
          MAN_POS.x += d; MAN_POS.y += d2;
        }
        colLog(shapeReport(debugSel));
        return;
      }
      if (k === "r") {
        if (debugSel !== null) {
          resetShape(debugSel);
          colLog("reset -> " + shapeReport(debugSel));
        } else {
          resetShape("box"); resetShape("trunkTop"); resetShape("kris"); resetShape("man");
          colLog("reset all -> " + shapeReport("box") + " | " + shapeReport("trunkTop") + " | " + shapeReport("kris") + " | " + shapeReport("man"));
        }
        return;
      }
    }
    if (k === "o") {
      if (state.moveMode) state.moveMode = false;
      state.treeSelMode = !state.treeSelMode;
      if (state.treeSelMode) state.treePage = 0;
      return;
    }
    if (k === "p") {
      if (state.treeSelMode) state.treeSelMode = false;
      state.moveMode = !state.moveMode;
      return;
    }
    if (state.moveMode) {
      if (k === "escape") { state.moveMode = false; return; }
      if (k === "arrowleft" || k === "a") { TREE.x -= 1; return; }
      if (k === "arrowright" || k === "d") { TREE.x += 1; return; }
      if (k === "arrowup" || k === "w") { TREE.y -= 1; return; }
      if (k === "arrowdown" || k === "s") { TREE.y += 1; return; }
      if (k === "+" || k === "=") { TREE.z = Math.min(3, +(TREE.z + 0.05).toFixed(2)); return; }
      if (k === "-" || k === "_") { TREE.z = Math.max(0.25, +(TREE.z - 0.05).toFixed(2)); return; }
      return;
    }
    if (state.treeSelMode) {
      if (k === "[" || k === "]") {
        state.treePage = state.treePage === 0 ? 1 : 0;
        playSound(cursorEl, 0.5);
        return;
      }
      if (k === "escape") { state.treeSelMode = false; return; }
      if (k >= "0" && k <= "9") {
        const num = k === "0" ? 10 : parseInt(k, 10);
        const idx = state.treePage * 10 + (num - 1);
        if (idx < TREES.length) {
          state.treeSel = idx;
          playSound(cursorEl, 0.5);
        }
        return;
      }
      return;
    }
  });

  // Start in the room immediately. The title/settings menu appears only after
  // a completed run: talk to the Man, take the Egg, then walk down through the
  // bottom entrance to leave.
  startGame();
  frame();
}

boot().catch(err => {
  ctx.fillStyle = "#fff";
  ctx.font = "16px monospace";
  ctx.fillText("Failed to load: " + err.message, 20, 40);
  ctx.fillText("Run index.html from a local folder (not file:// restrictions).", 20, 64);
});
</script>
</body>
</html>
